    <!-- Secure GitHub Pages SPA Redirect Handler -->
    <script>
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var path = l.search.slice(2).replace(/~and~/g, '&');
          if (!path.startsWith('//') && !path.includes('://')) {
            window.history.replaceState(null, null, '/' + path + l.hash);
          }
        }
      }(window.location));
    </script>
